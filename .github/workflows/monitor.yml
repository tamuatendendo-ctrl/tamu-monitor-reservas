name: TAMU Monitor de Reservas

# Monitor automático a cada 10 minutos

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar estado do monitor
        uses: actions/cache/restore@v4
        with:
          path: |
            reservas_processadas.json
            reservas_monitor.json
          key: tamu-monitor-state-${{ github.run_id }}
          restore-keys: |
            tamu-monitor-state-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar monitor
        env:
          STAYS_LOGIN: ${{ secrets.STAYS_LOGIN }}
          STAYS_SENHA: ${{ secrets.STAYS_SENHA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: python monitor_reservas.py

      - name: Salvar estado do monitor
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            reservas_processadas.json
            reservas_monitor.json
          key: tamu-monitor-state-${{ github.run_id }}
